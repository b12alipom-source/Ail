name: Build Bayan Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare signing keystores for CI build
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/release.jks" \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass bayanrelease \
            -keypass bayanrelease \
            -dname "CN=Bayan,O=BayanApp,C=IQ"

      - name: Build signed Release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          STORE_PASSWORD: bayanrelease
          KEY_PASSWORD: bayanrelease
        run: gradle assembleRelease --no-daemon

      - name: Rename APK for direct mobile download
        run: cp app/build/outputs/apk/release/app-release.apk Bayan-v2.0.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0
          name: Bayan V2.0 (Android APK)
          body: "تطبيق بيان مترجم الفيديو والصوت الفوري - جاهز للتثبيت المباشر على أندرويد."
          files: Bayan-v2.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bayan-v2.0-APK
          path: Bayan-v2.0.apk
